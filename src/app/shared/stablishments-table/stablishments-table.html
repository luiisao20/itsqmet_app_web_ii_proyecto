<div class="bg-slate-900 border border-slate-800 rounded-xl overflow-hidden shadow-sm">
  <div class="overflow-x-auto">
    <table class="w-full">
      <thead>
        <tr
          class="bg-slate-800/50 text-slate-500 text-xs font-bold uppercase tracking-wide border-b border-slate-800"
        >
          <th class="px-6 py-4">ID</th>
          <th class="px-6 py-4">Nombre</th>
          <th class="px-6 py-4">Ciudad</th>
          <th class="px-6 py-4">Dirección</th>
          <th class="px-6 py-4">Acciones</th>
        </tr>
      </thead>
      <tbody class="divide-y divide-slate-800">
        @for (item of query.data(); track item.id) {
          <tr class="group hover:bg-cyan-500/5 transition-colors">
            <td class="px-6 py-3 text-center text-slate-400 text-sm">{{ item.id }}</td>
            <td class="px-6 py-3 text-center">
              <span
                class="py-1 text-slate-300 text-sm font-semibold rounded-md"
                >{{ item.name }}</span
              >
            </td>
            <td class="px-6 py-3 text-center text-slate-400 text-sm">{{ item.address.city }}</td>
            <td class="px-6 py-3 text-center text-slate-400 text-sm">
              {{ item.address.description }}
            </td>
            <td class="px-6 py-3">
              @if (!isForm) {
                <div class="flex items-center justify-center gap-2">
                  <button
                    (click)="onSelectToEdit(item)"
                    class="py-1 px-2 text-slate-400 hover:text-cyan-500 hover:bg-cyan-900/20 rounded-lg transition-all cursor-pointer"
                  >
                    <ng-icon name="heroPencilSquare" class="icon-main" size="20"></ng-icon>
                  </button>
                  <button
                    (click)="onSelectToDelete(item.id)"
                    class="py-1 px-2 text-slate-400 hover:text-red-500 hover:bg-red-900/20 rounded-lg transition-all cursor-pointer"
                  >
                    <ng-icon name="heroTrash" color="red" size="20"></ng-icon>
                  </button>
                </div>
              } @else {
                <a
                  (click)="onSelectItem(item)"
                  class="text-main hover:underline hover:underline-offset-2 cursor-pointer"
                >
                  Seleccionar
                </a>
              }
            </td>
          </tr>
        } @empty {
          <tr>
            <td colspan="5" class="px-6 py-8 text-center text-slate-500">
              No hay establecimientos registrados
            </td>
          </tr>
        }
      </tbody>
    </table>
  </div>
</div>

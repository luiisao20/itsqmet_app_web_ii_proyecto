<div class="border border-cyan-50/10 rounded-2xl shadow-md shadow-main shrink flex flex-col h-full">
  <img [src]="image" alt="" class="h-40 w-full object-cover rounded-t-2xl mb-6" />
  <div class="px-4 pt-2 pb-4">
    <ng-icon [name]="icon" class="icon-main" size="24"></ng-icon>
    <h2 class="text-cyan-50 font-semibold mb-4">{{ title }}</h2>
    <p class="text-xs text-cyan-50/60">{{ description }}</p>
  </div>
</div>

<div class="flex gap-4 bg-cyan-500/10 border-2 border-cyan-100/20 rounded-xl p-4 hover:border-cyan-500/30 transition-all">
  <img
    [src]="movieImage()"
    [alt]="movieTitle()"
    class="w-20 h-28 object-cover rounded-lg flex-shrink-0"
  />
  <div class="flex flex-col flex-1 min-w-0">
    <div class="flex items-start justify-between gap-2">
      <h3 class="text-cyan-50 font-semibold text-base truncate">{{ movieTitle() }}</h3>
      <span
        class="text-xs font-bold px-2 py-0.5 rounded-full flex-shrink-0"
        [class]="
          schedule().type === 'VIP'
            ? 'bg-amber-500/20 text-amber-400'
            : schedule().type === 'IMAX'
              ? 'bg-purple-500/20 text-purple-400'
              : 'bg-cyan-500/20 text-cyan-400'
        "
      >
        {{ schedule().type }}
      </span>
    </div>

    <p class="text-cyan-50/50 text-xs mt-1">{{ establishmentName() }}</p>

    <div class="flex flex-wrap items-center gap-x-4 gap-y-1 mt-auto text-xs text-cyan-50/70">
      <span>{{ scheduleDate() | date: 'dd MMM yyyy' }}</span>
      <span>{{ scheduleTime() }}</span>
      <span>Sala {{ ticket().room }}</span>
    </div>

    <div class="flex items-center justify-between mt-2">
      <div class="flex items-center gap-2">
        <span class="text-xs text-cyan-50/50">Asientos:</span>
        <span class="text-xs text-cyan-50 font-medium">{{ seatsLabel() }}</span>
      </div>
      <span class="text-cyan-400 font-bold text-sm">${{ ticket().price | number: '1.2-2' }}</span>
    </div>
  </div>
</div>

<section class="py-8 bg-slate-100 dark:bg-white/5 border-b border-white/5">
  <div class="max-w-7xl mx-auto px-6 lg:px-20">
    <div class="flex flex-wrap items-center justify-between gap-6">
      <div class="flex items-center gap-4 overflow-x-auto hide-scrollbar pb-2 lg:pb-0">
        @for (category of categories; track $index) {
          <app-button
            [title]="category.name"
            [shadow]="category.selectCategory ? 'shadow-md shadow-cyan-500/20' : ''"
            [background]="
              category.selectCategory
                ? 'bg-cyan-500'
                : 'bg-white/5 dark:bg-white/10 hover:bg-cyan-500/5'
            "
            [border]="!category.selectCategory"
            [borderColor]="
              category.selectCategory ? '' : 'border-white/10 hover:border-cyan-500/30'
            "
            paddingHorizontal="px-6"
            paddingVertical="py-2"
            [textStyle]="
              category.selectCategory
                ? 'text-white text-sm font-bold'
                : 'text-slate-600 dark:text-slate-300 text-sm font-medium group-hover:text-cyan-500 transition-colors'
            "
          ></app-button>
        }
      </div>
      <div class="flex items-center gap-4">
        <span class="text-sm text-slate-500 font-medium">Ordenar por:</span>
        <button
          class="flex items-center gap-2 bg-white dark:bg-white/5 px-4 py-2 rounded-lg text-sm border border-slate-200 dark:border-white/10 cursor-pointer"
        >
          <span class="font-bold">Populares</span>
          <svg
            xmlns="http://www.w3.org/2000/svg"
            fill="none"
            viewBox="0 0 24 24"
            stroke-width="1.5"
            stroke="currentColor"
            class="size-4 text-white"
          >
            <path stroke-linecap="round" stroke-linejoin="round" d="m19.5 8.25-7.5 7.5-7.5-7.5" />
          </svg>
        </button>
      </div>
    </div>
  </div>
</section>

<div class="flex justify-center items-center gap-6 mb-4">
  <ng-icon name="ionArrowBack" size="20"></ng-icon>
  <p class="text-center font-semibold text-base text-main">Desliza para escoger más categorías</p>
  <ng-icon name="ionArrowForward" size="20"></ng-icon>
</div>
<div class="relative">
  <div
    class="pointer-events-none absolute left-0 top-0 h-full w-16 bg-linear-to-r from-white dark:from-slate-900 to-transparent"
  ></div>
  <div class="flex items-center gap-4 overflow-x-auto hide-scrollbar pb-2 lg:pb-0 px-6">
    @for (category of categories(); track $index) {
      <app-button
        [title]="category.name"
        [shadow]="category.selectCategory ? 'shadow-md shadow-cyan-500/20' : ''"
        [background]="
          category.selectCategory
            ? 'bg-cyan-500'
            : 'bg-white/5 dark:bg-white/10 hover:bg-cyan-500/5'
        "
        [border]="!category.selectCategory"
        [borderColor]="category.selectCategory ? '' : 'border-white/10 hover:border-cyan-500/30'"
        paddingHorizontal="px-6"
        paddingVertical="py-2"
        (click)="selectCategory(category)"
        [textStyle]="
          category.selectCategory
            ? 'text-white text-sm font-bold'
            : 'text-slate-600 dark:text-slate-300 text-sm font-medium group-hover:text-cyan-500 transition-colors'
        "
      ></app-button>
    }
    <div
      class="pointer-events-none absolute right-0 top-0 h-full w-16 bg-linear-to-l from-white dark:from-slate-900 to-transparent"
    ></div>
  </div>
</div>

<div class="flex justify-center items-center gap-6 mb-4">
  <button (click)="scrollLeft()" class="cursor-pointer text-slate-400 hover:text-cyan-500 hover:scale-125 active:scale-95 transition-all duration-200" aria-label="Scroll left">
    <ng-icon name="ionArrowBack" size="20"></ng-icon>
  </button>
  <p class="text-center font-semibold text-base text-main">
    <span class="md:hidden">Desliza para escoger más categorías</span>
    <span class="hidden md:inline">Escoger más categorías</span>
  </p>
  <button (click)="scrollRight()" class="cursor-pointer text-slate-400 hover:text-cyan-500 hover:scale-125 active:scale-95 transition-all duration-200" aria-label="Scroll right">
    <ng-icon name="ionArrowForward" size="20"></ng-icon>
  </button>
</div>
<div class="relative">
  <div
    class="pointer-events-none absolute left-0 top-0 h-full w-16 bg-linear-to-r from-white dark:from-slate-900 to-transparent"
  ></div>
  <div #scrollContainer class="flex items-center gap-4 overflow-x-auto hide-scrollbar pb-2 lg:pb-0 px-6 scroll-smooth">
    <app-button
      title="Todo"
      [shadow]="isAllSelected() ? 'shadow-md shadow-cyan-500/20' : ''"
      [background]="
        isAllSelected()
          ? 'bg-cyan-500'
          : 'bg-white/5 dark:bg-white/10 hover:bg-cyan-500/5'
      "
      [border]="!isAllSelected()"
      [borderColor]="isAllSelected() ? '' : 'border-white/10 hover:border-cyan-500/30'"
      paddingHorizontal="px-6"
      paddingVertical="py-2"
      (click)="selectAll()"
      [textStyle]="
        isAllSelected()
          ? 'text-white text-sm font-bold'
          : 'text-slate-600 dark:text-slate-300 text-sm font-medium group-hover:text-cyan-500 transition-colors'
      "
    ></app-button>
    @for (category of categories(); track $index) {
      <app-button
        [title]="category.name"
        [shadow]="category.selectCategory ? 'shadow-md shadow-cyan-500/20' : ''"
        [background]="
          category.selectCategory
            ? 'bg-cyan-500'
            : 'bg-white/5 dark:bg-white/10 hover:bg-cyan-500/5'
        "
        [border]="!category.selectCategory"
        [borderColor]="category.selectCategory ? '' : 'border-white/10 hover:border-cyan-500/30'"
        paddingHorizontal="px-6"
        paddingVertical="py-2"
        (click)="selectCategory(category)"
        [textStyle]="
          category.selectCategory
            ? 'text-white text-sm font-bold'
            : 'text-slate-600 dark:text-slate-300 text-sm font-medium group-hover:text-cyan-500 transition-colors'
        "
      ></app-button>
    }
    <div
      class="pointer-events-none absolute right-0 top-0 h-full w-16 bg-linear-to-l from-white dark:from-slate-900 to-transparent"
    ></div>
  </div>
</div>

<div class="flex items-center gap-4 overflow-x-auto hide-scrollbar pb-2 lg:pb-0">
  @for (category of categories; track $index) {
    <app-button
      [title]="category.name"
      [shadow]="category.selectCategory ? 'shadow-md shadow-cyan-500/20' : ''"
      [background]="
        category.selectCategory ? 'bg-cyan-500' : 'bg-white/5 dark:bg-white/10 hover:bg-cyan-500/5'
      "
      [border]="!category.selectCategory"
      [borderColor]="category.selectCategory ? '' : 'border-white/10 hover:border-cyan-500/30'"
      paddingHorizontal="px-6"
      paddingVertical="py-2"
      [textStyle]="
        category.selectCategory
          ? 'text-white text-sm font-bold'
          : 'text-slate-600 dark:text-slate-300 text-sm font-medium group-hover:text-cyan-500 transition-colors'
      "
    ></app-button>
  }
</div>

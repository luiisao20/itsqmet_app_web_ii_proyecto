<div
  class="flex items-center text-cyan-50/90 justify-center h-10 w-10 rounded-t-xl shadow-md transition-all duration-500"
  [ngClass]="
    isOccupied ? 'bg-slate-600 text-slate-400 cursor-not-allowed opacity-50' :
    isSelected ? 'bg-cyan-200 text-cyan-900 font-semibold shadow-md shadow-cyan-200 cursor-pointer hover:-translate-y-1 hover:shadow-cyan-200' :
    'bg-cyan-600 cursor-pointer hover:-translate-y-1 hover:shadow-cyan-200'
  "
>
  <p class="text-sm">
    {{ seatNumber }}
  </p>
</div>

<div class="group cursor-pointer">
  <div
    class="relative aspect-2/3 overflow-hidden rounded-xl bg-slate-200 dark:bg-white/5 mb-4 shadow-xl transition-all duration-500 group-hover:-translate-y-2 group-hover:shadow-cyan-500/10"
  >
    <div
      class="absolute inset-0 bg-cover bg-center"
      data-alt="High speed action movie poster with car chase"
      style="background-image: url('{{ movie.imageUrl }}')"
    ></div>
  </div>
  <h3 class="text-lg font-bold group-hover:text-(--main-color) transition-colors truncate">
    {{ movie.title }}
  </h3>
  <p class="text-sm text-slate-500 font-medium">{{ movie.category }} • {{ movie.time }}</p>
</div>

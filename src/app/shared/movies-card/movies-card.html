@if (isAuthenticated) {
  <div
    class="relative group flex flex-col rounded-xl overflow-hidden border border-[#2a2a2a] hover:border-cyan-500/50 cursor-pointer transition-all duration-300 shadow-xl hover:-translate-y-2 hover:shadow-cyan-500/20"
  >
    <div class="relative aspect-2/3 overflow-hidden">
      <a
        [href]="movie.trailer"
        target="_blank"
        rel="noopener noreferrer"
        class="absolute z-50 top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 rounded-full flex items-center justify-center hover:bg-gray-300/40 h-16 w-16"
      >
        <ng-icon name="ionPlayCircleOutline" class="white" size="60"></ng-icon>
      </a>
      <img
        alt="{{ movie.title }} movie poster"
        class="w-full h-full object-cover transition-transform duration-500 group-hover:scale-110"
        data-alt="{{ movie.title }} movie poster"
        src="{{ movie.imageUrl }}"
      />
      <div
        class="absolute top-3 right-3 bg-black/60 backdrop-blur-md px-2 py-1 rounded-md border border-white/20"
      >
        <div class="flex items-center gap-1 text-yellow-400">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 24 24"
            fill="currentColor"
            class="size-4"
          >
            <path
              fill-rule="evenodd"
              d="M10.788 3.21c.448-1.077 1.976-1.077 2.424 0l2.082 5.006 5.404.434c1.164.093 1.636 1.545.749 2.305l-4.117 3.527 1.257 5.273c.271 1.136-.964 2.033-1.96 1.425L12 18.354 7.373 21.18c-.996.608-2.231-.29-1.96-1.425l1.257-5.273-4.117-3.527c-.887-.76-.415-2.212.749-2.305l5.404-.434 2.082-5.005Z"
              clip-rule="evenodd"
            />
          </svg>

          <span class="text-xs font-bold text-white">{{ movie.rating }}</span>
        </div>
      </div>
      <div class="absolute bottom-3 left-3 flex gap-1">
        <span
          class="bg-black/80 backdrop-blur-md text-white text-[10px] font-bold px-2 py-0.5 rounded border border-white/10 uppercase"
          >{{ movie.category }}</span
        >
      </div>
    </div>
    <div class="p-4 flex flex-col flex-1">
      <h3
        class="text-lg font-bold mb-1 group-hover:text-(--main-color) transition-colors line-clamp-1"
      >
        {{ movie.title }}
      </h3>
      <p class="text-xs text-gray-500 mb-4">{{ movie.category }} • {{ movie.time }} min</p>
      <ng-template #ticketIcon>
        <svg
          xmlns="http://www.w3.org/2000/svg"
          fill="none"
          viewBox="0 0 24 24"
          stroke-width="1.5"
          stroke="currentColor"
          class="group size-6 text-(--main-color) group-hover:text-white"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M16.5 6v.75m0 3v.75m0 3v.75m0 3V18m-9-5.25h5.25M7.5 15h3M3.375 5.25c-.621 0-1.125.504-1.125 1.125v3.026a2.999 2.999 0 0 1 0 5.198v3.026c0 .621.504 1.125 1.125 1.125h17.25c.621 0 1.125-.504 1.125-1.125v-3.026a2.999 2.999 0 0 1 0-5.198V6.375c0-.621-.504-1.125-1.125-1.125H3.375Z"
          />
        </svg>
      </ng-template>

      <app-button
        title="COMPRAR"
        [prefixIcon]="ticketIcon"
        background="bg-(--main-color)/10 hover:bg-(--main-color)"
        textStyle="text-(--main-color) group-hover:text-white font-bold text-sm "
        [routerLink]="['booking', movie.id]"
      ></app-button>
    </div>
  </div>
} @else {
  <div class="group cursor-pointer">
    <div
      class="relative aspect-2/3 overflow-hidden rounded-xl bg-slate-200 dark:bg-white/5 mb-4 shadow-xl transition-all duration-500 group-hover:-translate-y-2 group-hover:shadow-cyan-500/20"
    >
      <a
        [href]="movie.trailer"
        target="_blank"
        rel="noopener noreferrer"
        class="absolute z-50 top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 rounded-full flex items-center justify-center hover:bg-gray-300/40 h-16 w-16"
      >
        <ng-icon name="ionPlayCircleOutline" class="white" size="60"></ng-icon>
      </a>
      <a
        routerLink="/login"
        class="absolute inset-0 bg-cover bg-center"
        data-alt="High speed action movie poster with car chase"
        style="background-image: url('{{ movie.imageUrl }}')"
      ></a>
    </div>
    <h3 class="text-lg font-bold group-hover:text-(--main-color) transition-colors line-clamp-1">
      {{ movie.title }}
    </h3>
    <p class="text-sm text-slate-500 font-medium">{{ movie.category }} • {{ movie.time }} min</p>
  </div>
}

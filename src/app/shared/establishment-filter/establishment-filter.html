<div class="relative">
  <button
    (click)="toggleDropdown()"
    class="flex items-center gap-2 bg-white dark:bg-white/5 px-4 py-2.5 rounded-lg text-sm border border-slate-200 dark:border-white/10 min-w-[220px] transition-colors"
    [class.cursor-pointer]="!query.isPending()"
    [class.cursor-not-allowed]="query.isPending()"
    [class.opacity-60]="query.isPending()"
    [class.hover:border-cyan-500/30]="!query.isPending()"
  >
    <svg
      xmlns="http://www.w3.org/2000/svg"
      fill="none"
      viewBox="0 0 24 24"
      stroke-width="1.5"
      stroke="currentColor"
      class="size-4 text-cyan-500 shrink-0"
    >
      <path
        stroke-linecap="round"
        stroke-linejoin="round"
        d="M13.5 21v-7.5a.75.75 0 0 1 .75-.75h3a.75.75 0 0 1 .75.75V21m-4.5 0H2.36m11.14 0H18m0 0h3.64m-1.39 0V9.349M3.75 21V9.349m0 0a3.001 3.001 0 0 0 3.75-.615A2.993 2.993 0 0 0 9.75 9.75c.896 0 1.7-.393 2.25-1.016a2.993 2.993 0 0 0 2.25 1.016c.896 0 1.7-.393 2.25-1.015a3.001 3.001 0 0 0 3.75.614m-16.5 0a3.004 3.004 0 0 1-.621-4.72l1.189-1.19A1.5 1.5 0 0 1 5.378 3h13.243a1.5 1.5 0 0 1 1.06.44l1.19 1.189a3 3 0 0 1-.621 4.72M6.75 18h3.75a.75.75 0 0 0 .75-.75V13.5a.75.75 0 0 0-.75-.75H6.75a.75.75 0 0 0-.75.75v3.75c0 .414.336.75.75.75Z"
      />
    </svg>

    @if (query.isPending()) {
      <span class="font-medium text-slate-400 dark:text-slate-500 truncate flex items-center gap-2">
        <svg class="animate-spin size-4 text-cyan-500" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
          <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path>
        </svg>
        Cargando...
      </span>
    } @else {
      <span class="font-medium text-slate-700 dark:text-slate-300 truncate">
        {{ selectedEstablishment() ? selectedEstablishment()!.name : 'Todos los establecimientos' }}
      </span>
    }

    <svg
      xmlns="http://www.w3.org/2000/svg"
      fill="none"
      viewBox="0 0 24 24"
      stroke-width="1.5"
      stroke="currentColor"
      class="size-4 text-slate-400 ml-auto shrink-0 transition-transform"
      [class.rotate-180]="isOpen"
    >
      <path stroke-linecap="round" stroke-linejoin="round" d="m19.5 8.25-7.5 7.5-7.5-7.5" />
    </svg>
  </button>

  @if (isOpen && query.data()) {
    <div
      class="absolute top-full left-0 mt-2 w-full bg-white dark:bg-slate-800 rounded-lg border border-slate-200 dark:border-white/10 shadow-lg z-10 overflow-hidden"
    >
      <button
        (click)="selectEstablishment(null!)"
        class="w-full text-left px-4 py-2.5 text-sm cursor-pointer transition-colors"
        [class]="
          !selectedEstablishment()
            ? 'bg-cyan-500/10 text-cyan-500 font-semibold'
            : 'text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-white/5'
        "
      >
        Todos los establecimientos
      </button>
      @for (establishment of query.data(); track establishment.id) {
        <button
          (click)="selectEstablishment(establishment)"
          class="w-full text-left px-4 py-2.5 text-sm cursor-pointer transition-colors"
          [class]="
            selectedEstablishment()?.id === establishment.id
              ? 'bg-cyan-500/10 text-cyan-500 font-semibold'
              : 'text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-white/5'
          "
        >
          {{ establishment.name }}
        </button>
      }
    </div>
  }
</div>

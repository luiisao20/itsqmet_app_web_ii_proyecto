<div>
  <div class="flex items-center gap-1">
    @if (showMonth()) {
      <p class="text-cyan-500 font-semibold text-sm mr-2 shrink-0">{{ currentMonth() }}</p>
    }
    <button
      (click)="prevWeek()"
      class="cursor-pointer shrink-0 transition-all duration-200"
      [class]="weekOffset() > 0 ? 'text-slate-400 hover:text-cyan-500 hover:scale-125 active:scale-95' : 'text-slate-600 opacity-30 cursor-not-allowed'"
      [disabled]="weekOffset() === 0"
      aria-label="Semana anterior"
    >
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="size-4">
        <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 19.5 8.25 12l7.5-7.5" />
      </svg>
    </button>
    <div class="flex items-center gap-1.5 flex-1">
      @for (day of days(); track day.date) {
        <button
          (click)="selectDay(day)"
          class="flex flex-col items-center justify-center flex-1 h-14 rounded-lg cursor-pointer transition-all duration-200"
          [class]="selectedDate() === day.date
            ? 'bg-cyan-500 text-white shadow-md shadow-cyan-500/30'
            : 'bg-white/5 border border-white/10 text-slate-300 hover:border-cyan-500/30 hover:bg-cyan-500/5'"
        >
          <span class="text-[10px] font-medium leading-none" [class]="selectedDate() === day.date ? 'text-white/90' : 'text-slate-400'">
            {{ day.dayName }}
          </span>
          <span class="text-lg font-bold leading-tight">
            {{ day.dayNumber < 10 ? '0' + day.dayNumber : day.dayNumber }}
          </span>
        </button>
      }
    </div>
    <button
      (click)="nextWeek()"
      class="cursor-pointer text-slate-400 hover:text-cyan-500 hover:scale-125 active:scale-95 transition-all duration-200 shrink-0"
      aria-label="Semana siguiente"
    >
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="size-4">
        <path stroke-linecap="round" stroke-linejoin="round" d="m8.25 4.5 7.5 7.5-7.5 7.5" />
      </svg>
    </button>
  </div>
</div>

<div class="flex h-screen bg-slate-950 text-white overflow-hidden">
  <!-- Sidebar overlay mobile -->
  @if (sidebarOpen()) {
    <div class="fixed inset-0 bg-black/50 z-20 lg:hidden" (click)="toggleSidebar()"></div>
  }

  <!-- Sidebar -->
  <aside
    class="fixed lg:static inset-y-0 left-0 z-30 w-64 bg-cyan-950 border-r border-cyan-900/50 flex flex-col transition-transform duration-300 lg:translate-x-0"
    [class.-translate-x-full]="!sidebarOpen()"
    [class.translate-x-0]="sidebarOpen()"
  >
    <!-- Logo -->
    <div class="flex items-center justify-between h-16 px-6 border-b border-cyan-900/50">
      <a routerLink="/" class="text-xl font-bold text-cyan-400">Cinema Admin</a>
      <button class="lg:hidden text-cyan-300 hover:text-white cursor-pointer" (click)="toggleSidebar()">
        <ng-icon name="heroXMark" size="24"></ng-icon>
      </button>
    </div>

    <!-- Menu -->
    <nav class="flex-1 overflow-y-auto py-4 px-3">
      <ul class="space-y-1">
        @for (item of menuItems; track item.route) {
          <li>
            <a
              [routerLink]="[item.route]"
              routerLinkActive="bg-cyan-500/20 text-cyan-400 border-cyan-400"
              class="flex items-center gap-3 px-4 py-2.5 rounded-lg text-sm font-medium text-slate-300 hover:bg-cyan-500/10 hover:text-white transition-colors border-l-2 border-transparent"
              (click)="sidebarOpen() && toggleSidebar()"
            >
              <ng-icon [name]="item.icon" size="20"></ng-icon>
              {{ item.label }}
            </a>
          </li>
        }
      </ul>
    </nav>

    <!-- Sidebar footer -->
    <div class="p-4 border-t border-cyan-900/50">
      <a
        routerLink="/"
        class="flex items-center gap-3 px-4 py-2.5 rounded-lg text-sm font-medium text-slate-400 hover:bg-cyan-500/10 hover:text-white transition-colors"
      >
        <ng-icon name="heroArrowRightOnRectangle" size="20"></ng-icon>
        Volver al sitio
      </a>
    </div>
  </aside>

  <!-- Main content -->
  <div class="flex-1 flex flex-col min-w-0">
    <!-- Header -->
    <header class="h-16 bg-slate-900 border-b border-slate-800 flex items-center justify-between px-6 shrink-0">
      <button class="lg:hidden text-slate-400 hover:text-white cursor-pointer" (click)="toggleSidebar()">
        <ng-icon name="heroBars3" size="24"></ng-icon>
      </button>

      <div class="hidden lg:block">
        <h2 class="text-sm font-medium text-slate-400">Panel Administrativo</h2>
      </div>

      <div class="flex items-center gap-4">
        <span class="text-sm text-slate-400 hidden sm:block">{{ email }}</span>
        <div class="flex items-center gap-2">
          <button
            (click)="goToProfile()"
            class="p-2 text-slate-400 hover:text-cyan-400 hover:bg-slate-800 rounded-lg transition-colors cursor-pointer"
            title="Perfil"
          >
            <ng-icon name="heroUserCircle" size="22"></ng-icon>
          </button>
          <button
            (click)="logout()"
            class="p-2 text-slate-400 hover:text-red-400 hover:bg-slate-800 rounded-lg transition-colors cursor-pointer"
            title="Cerrar sesión"
          >
            <ng-icon name="heroArrowRightOnRectangle" size="22"></ng-icon>
          </button>
        </div>
      </div>
    </header>

    <!-- Content area -->
    <main class="flex-1 overflow-y-auto p-6 bg-slate-950">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>

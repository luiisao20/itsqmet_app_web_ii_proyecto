<div class="space-y-6">
  <div>
    <h1 class="text-2xl font-bold tracking-tight">Establecimientos</h1>
    <p class="text-slate-400 mt-1 text-sm">Gestiona los establecimientos de cine</p>
  </div>

  <!-- Form -->
  <div class="bg-cyan-950/20 p-6 rounded-xl border border-cyan-500/10 shadow-xl">
    <form (ngSubmit)="mutation.mutate()">
      <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
        <label class="flex flex-col gap-2">
          <p class="text-white/80 text-sm font-medium">Nombre</p>
          <input
            name="name"
            class="w-full rounded-lg bg-cyan-900/50 border-2 border-transparent focus:border-cyan-500 outline-none text-white px-4 py-2 placeholder:text-white/30"
            placeholder="Nombre del establecimiento"
            type="text"
            [(ngModel)]="name"
          />
        </label>
        <label class="flex flex-col gap-2">
          <p class="text-white/80 text-sm font-medium">Ciudad</p>
          <input
            name="city"
            class="w-full rounded-lg bg-cyan-900/50 border-2 border-transparent focus:border-cyan-500 outline-none text-white px-4 py-2 placeholder:text-white/30"
            placeholder="Ciudad"
            type="text"
            [(ngModel)]="city"
          />
        </label>
        <label class="flex flex-col gap-2">
          <p class="text-white/80 text-sm font-medium">Dirección</p>
          <input
            name="description"
            class="w-full rounded-lg bg-cyan-900/50 border-2 border-transparent focus:border-cyan-500 outline-none text-white px-4 py-2 placeholder:text-white/30"
            placeholder="Dirección del establecimiento"
            type="text"
            [(ngModel)]="description"
          />
        </label>
      </div>
      <div class="flex gap-2 mt-4">
        <app-button
          type="submit"
          [title]="edit ? 'Actualizar' : 'Guardar'"
          [disabled]="name === '' || city === '' || description === ''"
          [background]="
            name === '' || city === '' || description === ''
              ? 'bg-gray-500 cursor-not-allowed'
              : 'bg-cyan-500 hover:bg-cyan-500/90 transition-all'
          "
          shadow="shadow-lg shadow-cyan-500/20"
          textStyle="text-white text-sm font-semibold"
          paddingHorizontal="px-6"
          paddingVertical="py-2"
        ></app-button>
        @if (edit) {
          <app-button
            type="button"
            title="Cancelar"
            background="bg-slate-600 hover:bg-slate-500 transition-all"
            textStyle="text-white text-sm font-semibold"
            paddingHorizontal="px-4"
            paddingVertical="py-2"
            (click)="resetForm()"
          ></app-button>
        }
      </div>
    </form>
  </div>

  <app-stablishments-table
    (deleteItem)="deleteEstablishment($event)"
    (editItem)="setToEdit($event)"
  ></app-stablishments-table>
</div>

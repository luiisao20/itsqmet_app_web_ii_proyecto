<div class="flex flex-col space-y-4 md:w-3/4 mx-auto md:px-0 p-4">
  <h2 class="font-semibold text-3xl text-center">Contactos</h2>
  <p class="font-semibold text-xl">
    Revisa aquí los clientes que se han intentado contactar con la administración
  </p>

  <div class="bg-slate-900 border border-slate-800 rounded-xl overflow-hidden shadow-sm mb-10">
    <div class="overflow-x-auto">
      <table class="w-full">
        <thead>
          <tr
            class="bg-slate-800/50 text-slate-500 text-xs font-bold uppercase tracking-wide border-b border-slate-800"
          >
            <th class="px-6 py-4">Nombre</th>
            <th class="px-6 py-4">Correo electrónico</th>
            <th class="px-6 py-4">Mensaje</th>
            <th class="px-6 py-4">Acciones</th>
          </tr>
        </thead>
        <tbody class="divide-y divide-slate-800">
          @for (item of contactList(); track item.id) {
            <tr class="group hover:bg-cyan-500/5 transition-colors">
              <td class="px-6 py-2">
                <span class="font-bold text-white group-hover:text-cyan-500 transition-colors">
                  {{ item.name }}
                </span>
              </td>
              <td class="px-6 py-2 text-center">
                {{ item.email }}
              </td>
              <td class="px-6 py-2 text-sm text-slate-400 text-center">{{ item.message }}</td>
              <td class="px-6 py-4">
                <div class="flex items-center justify-evenly gap-2">
                  <button
                    (click)="deleteContact(item.id!)"
                    class="py-1 px-2 text-slate-400 hover:text-cyan-500 hover:bg-cyan-900/20 rounded-lg transition-all cursor-pointer"
                  >
                    <ng-icon name="heroTrash" color="red" size="20"></ng-icon>
                  </button>
                </div>
              </td>
            </tr>
          }
        </tbody>
      </table>
    </div>
  </div>
</div>

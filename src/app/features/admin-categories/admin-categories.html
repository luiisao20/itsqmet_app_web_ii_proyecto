<div class="space-y-6">
  <div class="flex justify-between items-center">
    <div>
      <h1 class="text-2xl font-bold tracking-tight">Categorías</h1>
      <p class="text-slate-400 mt-1 text-sm">Gestiona las categorías de películas</p>
    </div>
  </div>

  <!-- Form -->
  <div class="bg-cyan-950/20 p-6 rounded-xl border border-cyan-500/10 shadow-xl">
    <form (ngSubmit)="mutation.mutate()" class="flex items-end gap-4">
      <label class="flex flex-col gap-2 flex-1">
        <p class="text-white/80 text-sm font-medium">Nombre de la categoría</p>
        <input
          name="categoryName"
          class="w-full rounded-lg bg-cyan-900/50 border-2 border-transparent focus:border-cyan-500 outline-none text-white px-4 py-2 placeholder:text-white/30"
          placeholder="Ej: Acción, Comedia, Terror..."
          type="text"
          [(ngModel)]="categoryName"
        />
      </label>
      <div class="flex gap-2">
        <app-button
          type="submit"
          [title]="edit ? 'Actualizar' : 'Guardar'"
          [disabled]="categoryName === ''"
          [background]="categoryName === '' ? 'bg-gray-500 cursor-not-allowed' : 'bg-cyan-500 hover:bg-cyan-500/90 transition-all'"
          shadow="shadow-lg shadow-cyan-500/20"
          textStyle="text-white text-sm font-semibold"
          paddingHorizontal="px-6"
          paddingVertical="py-2"
        ></app-button>
        @if (edit) {
          <app-button
            type="button"
            title="Cancelar"
            background="bg-slate-600 hover:bg-slate-500 transition-all"
            textStyle="text-white text-sm font-semibold"
            paddingHorizontal="px-4"
            paddingVertical="py-2"
            (click)="resetForm()"
          ></app-button>
        }
      </div>
    </form>
  </div>

  <!-- Table -->
  <div class="bg-slate-900 border border-slate-800 rounded-xl overflow-hidden shadow-sm">
    <div class="overflow-x-auto">
      <table class="w-full">
        <thead>
          <tr class="bg-slate-800/50 text-slate-500 text-xs font-bold uppercase tracking-wide border-b border-slate-800">
            <th class="px-6 py-4">ID</th>
            <th class="px-6 py-4">Nombre</th>
            <th class="px-6 py-4">Acciones</th>
          </tr>
        </thead>
        <tbody class="divide-y divide-slate-800">
          @for (item of query.data(); track item.id) {
            <tr class="group hover:bg-cyan-500/5 transition-colors">
              <td class="px-6 py-3 text-center text-slate-400 text-sm">{{ item.id }}</td>
              <td class="px-6 py-3 text-center">
                <span class="px-2.5 py-1 bg-slate-800/90 text-slate-300 text-sm font-semibold rounded-md">{{ item.name }}</span>
              </td>
              <td class="px-6 py-3">
                <div class="flex items-center justify-center gap-2">
                  <button
                    (click)="setToEdit(item)"
                    class="py-1 px-2 text-slate-400 hover:text-cyan-500 hover:bg-cyan-900/20 rounded-lg transition-all cursor-pointer"
                  >
                    <ng-icon name="heroPencilSquare" class="icon-main" size="20"></ng-icon>
                  </button>
                  <button
                    (click)="deleteCategory(item.id)"
                    class="py-1 px-2 text-slate-400 hover:text-red-500 hover:bg-red-900/20 rounded-lg transition-all cursor-pointer"
                  >
                    <ng-icon name="heroTrash" color="red" size="20"></ng-icon>
                  </button>
                </div>
              </td>
            </tr>
          } @empty {
            <tr>
              <td colspan="3" class="px-6 py-8 text-center text-slate-500">No hay categorías registradas</td>
            </tr>
          }
        </tbody>
      </table>
    </div>
  </div>
</div>

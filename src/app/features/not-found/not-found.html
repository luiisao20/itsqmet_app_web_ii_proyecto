<div
  class="relative flex min-h-[85vh] flex-col items-center justify-center overflow-hidden px-6 py-20"
>
  <div class="pointer-events-none absolute inset-0 flex items-center justify-center">
    <div class="h-[600px] w-[600px] rounded-full bg-cyan-500/5 blur-3xl"></div>
  </div>

  <div
    class="mb-10 h-1 w-40 rounded-full bg-linear-to-r from-cyan-500/10 via-cyan-500 to-blue-500/10"
  ></div>

  <div class="mb-2 flex items-center gap-2 text-cyan-500/60">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="size-6">
      <path
        fill-rule="evenodd"
        d="M1.5 5.625c0-1.036.84-1.875 1.875-1.875h17.25c1.035 0 1.875.84 1.875 1.875v12.75c0 1.035-.84 1.875-1.875 1.875H3.375A1.875 1.875 0 0 1 1.5 18.375V5.625Zm1.5 0v1.5c0 .207.168.375.375.375h1.5a.375.375 0 0 0 .375-.375v-1.5a.375.375 0 0 0-.375-.375h-1.5A.375.375 0 0 0 3 5.625Zm16.125-.375a.375.375 0 0 0-.375.375v1.5c0 .207.168.375.375.375h1.5A.375.375 0 0 0 21 7.125v-1.5a.375.375 0 0 0-.375-.375h-1.5ZM21 9.375A.375.375 0 0 0 20.625 9h-1.5a.375.375 0 0 0-.375.375v1.5c0 .207.168.375.375.375h1.5A.375.375 0 0 0 21 10.875v-1.5Zm0 3.75a.375.375 0 0 0-.375-.375h-1.5a.375.375 0 0 0-.375.375v1.5c0 .207.168.375.375.375h1.5a.375.375 0 0 0 .375-.375v-1.5Zm0 3.75a.375.375 0 0 0-.375-.375h-1.5a.375.375 0 0 0-.375.375v1.5c0 .207.168.375.375.375h1.5a.375.375 0 0 0 .375-.375v-1.5ZM4.875 18.75a.375.375 0 0 0 .375-.375v-1.5a.375.375 0 0 0-.375-.375h-1.5a.375.375 0 0 0-.375.375v1.5c0 .207.168.375.375.375h1.5ZM3.375 15h1.5a.375.375 0 0 0 .375-.375v-1.5a.375.375 0 0 0-.375-.375h-1.5a.375.375 0 0 0-.375.375v1.5c0 .207.168.375.375.375Zm0-3.75h1.5a.375.375 0 0 0 .375-.375v-1.5A.375.375 0 0 0 4.875 9h-1.5A.375.375 0 0 0 3 9.375v1.5c0 .207.168.375.375.375Zm0-3.75h1.5a.375.375 0 0 0 .375-.375v-1.5A.375.375 0 0 0 4.875 5.25h-1.5A.375.375 0 0 0 3 5.625v1.5c0 .207.168.375.375.375Z"
        clip-rule="evenodd"
      />
    </svg>
    <span class="text-xs font-semibold uppercase tracking-widest">Página no encontrada</span>
  </div>

  <h1
    class="select-none bg-linear-to-b from-cyan-400 to-cyan-500/10 bg-clip-text text-[10rem] font-black leading-none text-transparent"
  >
    404
  </h1>

  <h2 class="mt-4 text-center text-2xl font-extrabold text-cyan-50 md:text-3xl">
    Página no encontrada
  </h2>
  <p class="mt-3 max-w-sm text-center text-sm text-cyan-50/60">
    Parece que esta función ya terminó. La página que buscas no existe.
  </p>

  <div class="mt-10">
    <app-button
      title="Volver al inicio"
      [animation]="true"
      background="bg-(--main-color) hover:bg-(--main-color)/90"
      shadow="shadow-xl shadow-cyan-500/30"
      paddingHorizontal="px-8"
      paddingVertical="py-3"
      [routerLink]="['/']"
    ></app-button>
  </div>

  <div
    class="mt-10 h-1 w-40 rounded-full bg-linear-to-r from-cyan-500/10 via-cyan-500 to-blue-500/10"
  ></div>
</div>

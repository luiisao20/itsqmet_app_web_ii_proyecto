<div class="space-y-6">
  <div>
    <h1 class="text-2xl font-bold tracking-tight">Contactos</h1>
    <p class="text-slate-400 mt-1 text-sm">Mensajes recibidos de los usuarios</p>
  </div>

  <div class="bg-slate-900 border border-slate-800 rounded-xl overflow-hidden shadow-sm">
    <div class="overflow-x-auto">
      <table class="w-full">
        <thead>
          <tr class="bg-slate-800/50 text-slate-500 text-xs font-bold uppercase tracking-wide border-b border-slate-800">
            <th class="px-6 py-4">Nombre</th>
            <th class="px-6 py-4">Correo electrónico</th>
            <th class="px-6 py-4">Mensaje</th>
            <th class="px-6 py-4">Fecha</th>
            <th class="px-6 py-4">Acciones</th>
          </tr>
        </thead>
        <tbody class="divide-y divide-slate-800">
          @for (item of query.data(); track item.id) {
            <tr class="group hover:bg-cyan-500/5 transition-colors">
              <td class="px-6 py-3">
                <span class="font-semibold text-white text-sm group-hover:text-cyan-500 transition-colors">{{ item.name }}</span>
              </td>
              <td class="px-6 py-3 text-center text-slate-400 text-sm">{{ item.email }}</td>
              <td class="px-6 py-3 text-slate-400 text-sm max-w-xs truncate">{{ item.message }}</td>
              <td class="px-6 py-3 text-center text-slate-400 text-sm">{{ item.date | date:'short' }}</td>
              <td class="px-6 py-3">
                <div class="flex items-center justify-center gap-2">
                  <button
                    (click)="deleteContact(item.id!)"
                    class="py-1 px-2 text-slate-400 hover:text-red-500 hover:bg-red-900/20 rounded-lg transition-all cursor-pointer"
                  >
                    <ng-icon name="heroTrash" color="red" size="20"></ng-icon>
                  </button>
                </div>
              </td>
            </tr>
          } @empty {
            <tr>
              <td colspan="5" class="px-6 py-8 text-center text-slate-500">No hay contactos registrados</td>
            </tr>
          }
        </tbody>
      </table>
    </div>
  </div>
</div>

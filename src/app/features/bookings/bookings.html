<div class="py-6 px-8 bg-cyan-500/10 w-3/4 my-6 border-2 border-cyan-100/20 rounded-xl">
  <div class="h-2 w-3/4 mx-auto rounded-full bg-linear-to-r from-cyan-500/10 via-cyan-500 to-blue-500/10"></div>
  <h2 class="text-center font-semibold mt-4 mb-8">
    La pantalla está aquí
  </h2>
  <div class="flex flex-row gap-4 justify-center">
    <div class="grid grid-cols-1 gap-2 place-items-center">
      @for (item of rows; track $index) {
        <p class="text-sm h-10 flex justify-center items-center font-semibold">{{ item }}</p>
      }
    </div>
    <div class="grid grid-cols-10 gap-2">
      @for (item of seats; track $index) {
        <app-seat [seatNumber]="item.number"></app-seat>
      }
    </div>
  </div>
</div>
